<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#28558C">
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>WinBliss² — Styrning och kortkommandon</title>
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="css/wb-base.css">
<style>
body{font-family:"Atkinson Hyperlegible Next","Atkinson Hyperlegible",system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:15.5px;line-height:1.45}
header{display:flex;align-items:baseline;gap:14px;padding:12px 18px;flex-wrap:wrap}
header h1{font-size:21px}
header .sub{color:var(--dim);font-size:14px}
main{max-width:920px;margin:0 auto;padding:0 18px 40px;display:flex;flex-direction:column;gap:16px}
section{background:var(--panel);border:1px solid var(--rule);border-radius:16px;padding:16px 18px}
section h2{font-size:18px;margin:0 0 4px}
section > p.intro{color:var(--dim);margin:0 0 12px}
h3{font-size:15px;margin:14px 0 6px}
button{font:inherit;color:var(--ink);background:var(--panel-2);border:1px solid var(--rule);border-radius:10px;padding:7px 13px;cursor:pointer;min-height:42px}
button:hover{border-color:var(--accent)}
button:disabled{opacity:.45;cursor:default}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent,#fff);font-weight:600}
button.learning{background:var(--sel);border-color:var(--sel);color:#fff}
select{font:inherit;padding:6px 8px;border-radius:8px;border:1px solid var(--rule);background:var(--panel);color:var(--ink);min-height:40px}
/* the ways to steer: big choices */
#modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;border:0;padding:0;margin:0}
#modes legend{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.mode{display:flex;gap:10px;align-items:flex-start;border:2px solid var(--rule);border-radius:14px;padding:12px;cursor:pointer;background:var(--panel-2)}
.mode:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.mode input{width:22px;height:22px;margin-top:2px;flex:none;accent-color:var(--accent)}
.mode b{display:block;font-size:16px}
.mode span{color:var(--dim);font-size:14px}
table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:7px 10px 7px 0;vertical-align:middle;border-bottom:1px solid var(--rule)}
th[scope=col]{font-size:12.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--dim);font-weight:600}
td.cur{font-weight:600}
td.cur small{font-weight:400;color:var(--dim)}
td.act{white-space:nowrap;text-align:right}
td.act button{margin-left:6px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:8px 0}
.row label{display:flex;gap:8px;align-items:center}
input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent)}
input[type=range]{width:min(320px,60vw);accent-color:var(--accent)}
output{font-weight:600;min-width:4.5em;display:inline-block}
.note{min-height:1.45em;margin:10px 0 0;font-weight:600}
.note.bad{color:var(--sel)} .note.good{color:var(--ok)}
.try{display:flex;gap:10px;flex-wrap:wrap;align-items:center;border:1px dashed var(--rule);border-radius:12px;padding:10px 12px;margin-top:10px}
.try button{min-width:72px;min-height:56px;font-size:18px}
.dim{color:var(--dim)}
details.tool{border:1px solid var(--rule);border-radius:12px;padding:6px 12px;margin-top:10px;background:var(--panel)}
details.tool > summary{cursor:pointer;font-weight:600;font-size:16px;padding:6px 0}
#bottom{display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap}
footer{padding:3px 12px 8px;font-size:11px;color:var(--dim);text-align:center}
@media (max-width:640px){td.act{white-space:normal}td.act button{margin:3px 0 3px 6px}}
</style>
</head>
<body>
<header>
  <a class="homeLink" href="start.html" id="homeLink">⌂ Start</a>
  <h1 id="title">Styrning och kortkommandon</h1>
  <span class="sub" id="sub">gäller alla delar av Blissverktyget i den här webbläsaren</span>
</header>
<main>
  <section aria-labelledby="hMode">
    <h2 id="hMode"></h2>
    <p class="intro" id="iMode"></p>
    <fieldset id="modes"><legend id="lMode"></legend></fieldset>
    <p class="note" id="nMode" role="status" aria-live="polite"></p>
  </section>

  <section aria-labelledby="hSw">
    <h2 id="hSw"></h2>
    <p class="intro" id="iSw"></p>
    <table id="roles"><thead><tr><th scope="col" id="cRole"></th><th scope="col" id="cInput"></th><th scope="col"><span class="dim" id="cDo"></span></th></tr></thead><tbody></tbody></table>
    <p class="note" id="nSw" role="status" aria-live="polite"></p>
    <p class="dim" id="padState"></p>
    <div class="row"><label><input type="checkbox" id="optStick"> <span id="lStick"></span></label></div>
    <h3 id="hScan"></h3>
    <p class="dim" id="iScan" style="margin:0"></p>
    <div class="row"><label for="optScanMs" id="lScanMs"></label><input type="range" id="optScanMs" min="500" max="6000" step="100"><output id="oScanMs" for="optScanMs"></output></div>
    <div class="row"><label for="optRounds" id="lRounds"></label><select id="optRounds"></select></div>
    <div class="row"><label for="optRestart" id="lRestart"></label><select id="optRestart"></select></div>
    <div class="try" id="trySw" role="group"><span id="lTrySw"></span><button type="button">1</button><button type="button">2</button><button type="button">3</button><button type="button">4</button><span id="oTrySw" role="status" aria-live="polite"></span></div>
  </section>

  <section aria-labelledby="hEye">
    <h2 id="hEye"></h2>
    <p class="intro" id="iEye"></p>
    <div class="row"><label for="optDwell" id="lDwell"></label><input type="range" id="optDwell" min="400" max="4000" step="100"><output id="oDwell" for="optDwell"></output></div>
    <div class="row"><label><input type="checkbox" id="optRing"> <span id="lRing"></span></label></div>
    <div class="row"><label><input type="checkbox" id="optPause"> <span id="lPause"></span></label></div>
    <div class="try" id="tryEye" role="group"><span id="lTryEye"></span><button type="button">A</button><button type="button">B</button><button type="button">C</button><span id="oTryEye" role="status" aria-live="polite"></span></div>
  </section>

  <section aria-labelledby="hLook">
    <h2 id="hLook"></h2>
    <div class="row"><label><input type="checkbox" id="optStrong"> <span id="lStrong"></span></label></div>
  </section>

  <section aria-labelledby="hKeys">
    <h2 id="hKeys"></h2>
    <p class="intro" id="iKeys"></p>
    <p class="note" id="nKeys" role="status" aria-live="polite"></p>
    <div id="tools"></div>
  </section>

  <div id="bottom">
    <button type="button" id="btnReset"></button>
    <button type="button" id="btnDone" class="primary"></button>
  </div>
</main>
<footer>WinBliss² · 2026 AnyCom AB · CC BY 4.0</footer>
<script src="js/shared/lang.js"></script>
<script src="js/shared/styrning.js"></script>
<script src="js/shared/pwa.js"></script>
<script src="js/shared/switch.js"></script>
<script>
'use strict';
const $ = (id) => document.getElementById(id);
const LNG = wbLang();
const tr = (en, sv) => (LNG === 'sv' ? sv : en);
document.documentElement.lang = LNG;
const ST = wbStyr, SW = wbSwitch;
const S = () => ST.settings;
const put = (patch) => ST.save(Object.assign({}, S(), patch));
const note = (id, t, cls) => { $(id).textContent = t; $(id).className = 'note' + (cls ? ' ' + cls : ''); };
const secs = (ms) => (ms / 1000).toLocaleString(LNG === 'sv' ? 'sv-SE' : 'en-GB', { maximumFractionDigits: 1 }) + ' s';

/* ---- the words ---- */
document.title = 'WinBliss² — ' + tr('Steering and shortcuts', 'Styrning och kortkommandon');
const TEXT = {
  homeLink: tr('⌂ Start', '⌂ Start'),
  title: tr('Steering and shortcuts', 'Styrning och kortkommandon'),
  sub: tr('holds for every part of Blissverktyget in this browser — open parts follow at once', 'gäller alla delar av Blissverktyget i den här webbläsaren — öppna delar följer med direkt'),
  hMode: tr('How do you steer?', 'Hur styr du?'),
  iMode: tr('The mouse, touch and the keyboard always work too. The choice holds in every part.', 'Mus, pekskärm och tangentbord fungerar alltid också. Valet gäller i alla delar.'),
  lMode: tr('How do you steer?', 'Hur styr du?'),
  hSw: tr('Switches and joystick', 'Brytare och joystick'),
  iSw: tr('Teach Blissverktyget which keys or buttons your switches send: press Learn and then the switch. A joystick (a game controller) works at once: the stick steps and its first button chooses.',
          'Lär Blissverktyget vilka tangenter eller knappar dina brytare skickar: tryck Lär in och sedan på brytaren. En joystick (handkontroll) fungerar direkt: spaken stegar och första knappen väljer.'),
  cRole: tr('Switch', 'Brytare'), cInput: tr('Key or button', 'Tangent eller knapp'), cDo: '',
  lStick: tr("The joystick's stick and cross step (right/down forward, left/up back)", 'Joystickens spak och styrkors stegar (höger/ner framåt, vänster/upp bakåt)'),
  hScan: tr('One switch: stepping by itself', 'En brytare: stegar av sig själv'),
  iScan: tr('With One switch chosen above, the buttons are marked one at a time and the switch chooses the marked one.', 'När En brytare är valt ovan markeras knapparna en i taget, och brytaren väljer den markerade.'),
  lScanMs: tr('Time on each button', 'Tid på varje knapp'),
  lRounds: tr('Rounds before it rests', 'Varv innan den vilar'),
  lRestart: tr('After a choice', 'Efter ett val'),
  lTrySw: tr('Try it:', 'Prova:'),
  hEye: tr('Eye control', 'Ögonstyrning'),
  iEye: tr('Look at a button and rest your eyes there: a ring fills, then the button is pressed. To press the same button again, look away first. The pause button in the lower left corner stops it while you read.',
           'Titta på en knapp och vila blicken där: en ring fylls, sedan trycks knappen. För att trycka samma knapp igen tittar du bort först. Pausknappen nere till vänster stoppar medan du läser.'),
  lDwell: tr('Resting time', 'Vilotid'),
  lRing: tr('Show the ring that fills', 'Visa ringen som fylls'),
  lPause: tr('Show the pause button', 'Visa pausknappen'),
  lTryEye: tr('Try it:', 'Prova:'),
  hLook: tr('Seeing where you are', 'Se var du är'),
  lStrong: tr('A clear marking — a thick yellow and black ring on the button in turn', 'Tydlig markering — en tjock gul och svart ring runt knappen som är på tur'),
  hKeys: tr('Keyboard shortcuts', 'Kortkommandon'),
  iKeys: tr('Press Change, then the key, key combination or joystick button you want. Esc cancels. Keys marked "always" keep working; yours is then an extra one.',
            'Tryck Ändra och sedan den tangent, tangentkombination eller joystickknapp du vill använda. Esc avbryter. Tangenter märkta "alltid" fortsätter att fungera; din blir då en extra.'),
  btnReset: tr('Reset everything', 'Återställ allt'),
  btnDone: tr('Done', 'Klar'),
};
for (const [id, t] of Object.entries(TEXT)) if ($(id)) $(id).textContent = t;
$('homeLink').title = tr('To the start page', 'Till startsidan');

/* ---- how do you steer ---- */
const MODES = [
  ['standard', tr('Mouse, touch and keyboard', 'Mus, pekskärm och tangentbord'), tr('as usual', 'som vanligt')],
  ['brytare2', tr('Two switches', 'Två brytare'), tr('one steps to the next button, the other chooses', 'en stegar till nästa knapp, den andra väljer')],
  ['brytare1', tr('One switch', 'En brytare'), tr('the buttons are stepped through by themselves, the switch chooses', 'knapparna stegas igenom av sig själva, brytaren väljer')],
  ['oga', tr('Eye control', 'Ögonstyrning'), tr('look at a button and rest there', 'titta på en knapp och vila där')],
];
for (const [v, name, desc] of MODES) {
  const l = document.createElement('label');
  l.className = 'mode';
  l.innerHTML = '<input type="radio" name="mode"><div><b></b><span></span></div>';
  l.querySelector('input').value = v;
  l.querySelector('b').textContent = name;
  l.querySelector('span').textContent = desc;
  l.querySelector('input').onchange = () => {
    const was = S().mode;
    const patch = { mode: v };
    // a switch or the eyes: the clear marking comes along (it can be turned off below)
    if (was === 'standard' && v !== 'standard' && !S().strong) patch.strong = true;
    put(patch);
    note('nMode', modeNote(v) + (patch.strong ? ' ' + tr('The clear marking is on too.', 'Tydlig markering är också påslagen.') : ''), 'good');
  };
  $('modes').appendChild(l);
}
function modeNote(v) {
  const c = SW.config;
  if (v === 'brytare2' && !(c.step && c.confirm)) return tr('Two switches — learn Step and Choose below (a joystick works at once).', 'Två brytare — lär in Stega och Välj nedan (en joystick fungerar direkt).');
  if (v === 'brytare1' && !c.confirm && !c.step) return tr('One switch — learn Choose below, or use Enter, Space or a joystick button.', 'En brytare — lär in Välj nedan, eller använd Enter, Mellanslag eller en joystickknapp.');
  if (v === 'brytare1') return tr('One switch — the stepping starts by itself; the switch chooses.', 'En brytare — stegningen startar av sig själv; brytaren väljer.');
  if (v === 'oga') return tr('Eye control — rest on a button to press it. Pause sits in the lower left corner.', 'Ögonstyrning — vila på en knapp för att trycka på den. Paus finns nere till vänster.');
  if (v === 'brytare2') return tr('Two switches — on.', 'Två brytare — på.');
  return tr('Mouse, touch and keyboard.', 'Mus, pekskärm och tangentbord.');
}

/* ---- switches ---- */
const ROLE_LABEL = { step: tr('Step', 'Stega'), confirm: tr('Choose', 'Välj'), back: tr('Step back (optional)', 'Stega bakåt (valfri)') };
let busy = null;                                   // the button waiting for a press
function stopBusy() { if (busy) { busy.classList.remove('learning'); busy = null; } SW.cancelCapture(); }
function renderRoles() {
  const tb = $('roles').tBodies[0];
  tb.innerHTML = '';
  for (const r of SW.ROLES) {
    const row = tb.insertRow();
    row.innerHTML = '<th scope="row"></th><td class="cur"></td><td class="act"><button type="button" data-l></button><button type="button" data-x></button></td>';
    row.cells[0].textContent = ROLE_LABEL[r];
    row.cells[1].textContent = SW.config[r] ? SW.nameOf(SW.config[r]) : tr('not learned', 'inte inlärd');
    const l = row.querySelector('[data-l]'), x = row.querySelector('[data-x]');
    l.textContent = tr('Learn', 'Lär in');
    l.setAttribute('aria-label', tr('Learn ', 'Lär in ') + ROLE_LABEL[r]);
    x.textContent = tr('Remove', 'Ta bort');
    x.setAttribute('aria-label', tr('Remove ', 'Ta bort ') + ROLE_LABEL[r]);
    x.disabled = !SW.config[r];
    x.onclick = () => { SW.setRole(r, null); renderRoles(); note('nSw', tr('Removed.', 'Borttagen.')); };
    l.onclick = () => learnRole(r, l);
  }
}
function learnRole(r, btn) {
  stopBusy();
  busy = btn; btn.classList.add('learning'); btn.textContent = tr('Press now…', 'Tryck nu…');
  note('nSw', tr(`Press the switch for ${ROLE_LABEL[r]} now. Esc cancels.`, `Tryck på brytaren för ${ROLE_LABEL[r]} nu. Esc avbryter.`));
  SW.capture((x) => {
    busy = null;
    if (!x) { renderRoles(); note('nSw', tr('Cancelled — nothing was changed.', 'Avbrutet — inget ändrades.')); return; }
    // a joystick button or a key given to a shortcut is the switch's now
    const taken = [];
    for (const g of WB_KEYMAP) for (const k of g.keys) {
      const o = ST.own(g.tool, k.id);
      if (o && (x.pad ? ST.samePad(o, x) : !o.pad && o.key === ST.keyOf(Object.assign({ altKey: false, ctrlKey: false, metaKey: false, shiftKey: false }, x)))) {
        ST.setOwn(g.tool, k.id, null); taken.push(LNG === 'sv' ? k.sv : k.en);
      }
    }
    SW.setRole(r, x);
    renderRoles(); renderKeys();
    const n = SW.nameOf(x);
    note('nSw', (SW.native(r, x) ? tr(`${n}: what that key always does — it works as before.`, `${n}: det tangenten alltid gör — det fungerar som förut.`)
      : SW.typesChar(x) ? tr(`${ROLE_LABEL[r]}: ${n}. It types a character, so in text fields it types as usual — an F key (F1–F12) works everywhere, if the switch can send one.`,
                             `${ROLE_LABEL[r]}: ${n}. Den skriver ett tecken, så i textrutor skriver den som vanligt — en F-tangent (F1–F12) fungerar överallt, om brytaren kan skicka det.`)
      : tr(`${ROLE_LABEL[r]}: ${n}. Try it on the buttons below.`, `${ROLE_LABEL[r]}: ${n}. Prova på knapparna nedan.`)) +
      (taken.length ? ' ' + tr('It no longer does: ', 'Den gör inte längre: ') + taken.join(', ') + '.' : ''), 'good');
  });
}
function padState(name) {
  $('padState').textContent = name ? tr('Joystick connected: ', 'Joystick ansluten: ') + name
    : tr('No joystick found — connect it and press one of its buttons.', 'Ingen joystick hittad — anslut den och tryck på en av dess knappar.');
}
SW.onPadChange(padState); padState(SW.padName());
$('optStick').onchange = () => SW.setStick($('optStick').checked);
for (let n = 1; n <= 9; n++) $('optRounds').add(new Option(String(n), String(n)));
$('optRestart').add(new Option(tr('go on from the button chosen', 'fortsätt från knappen som valdes'), 'no'));
$('optRestart').add(new Option(tr('start again from the first button', 'börja om från första knappen'), 'yes'));
$('optScanMs').oninput = () => { $('oScanMs').textContent = secs(+$('optScanMs').value); };
$('optScanMs').onchange = () => put({ scan: Object.assign({}, S().scan, { ms: +$('optScanMs').value }) });
$('optRounds').onchange = () => put({ scan: Object.assign({}, S().scan, { rounds: +$('optRounds').value }) });
$('optRestart').onchange = () => put({ scan: Object.assign({}, S().scan, { restart: $('optRestart').value === 'yes' }) });
for (const b of $('trySw').querySelectorAll('button')) b.onclick = () => { $('oTrySw').textContent = tr('✓ Chosen: ', '✓ Valt: ') + b.textContent; };

/* ---- eye control ---- */
$('optDwell').oninput = () => { $('oDwell').textContent = secs(+$('optDwell').value); };
$('optDwell').onchange = () => put({ dwell: Object.assign({}, S().dwell, { ms: +$('optDwell').value }) });
$('optRing').onchange = () => put({ dwell: Object.assign({}, S().dwell, { ring: $('optRing').checked }) });
$('optPause').onchange = () => put({ dwell: Object.assign({}, S().dwell, { pause: $('optPause').checked }) });
for (const b of $('tryEye').querySelectorAll('button')) b.onclick = () => { $('oTryEye').textContent = tr('✓ Pressed: ', '✓ Tryckt: ') + b.textContent; };
$('optStrong').onchange = () => put({ strong: $('optStrong').checked });

/* ---- shortcuts ---- */
const open = new Set(['alla']);                     // the parts shown open
function renderKeys() {
  const host = $('tools');
  for (const d of host.querySelectorAll('details')) if (d.open) open.add(d.dataset.tool); else open.delete(d.dataset.tool);
  host.innerHTML = '';
  for (const g of WB_KEYMAP) {
    const d = document.createElement('details');
    d.className = 'tool'; d.dataset.tool = g.tool; d.open = open.has(g.tool);
    const sum = document.createElement('summary');
    const owned = g.keys.filter(k => ST.own(g.tool, k.id)).length;
    sum.textContent = (LNG === 'sv' ? g.sv : g.en) + (owned ? tr(` · ${owned} of your own`, ` · ${owned} egna`) : '');
    d.appendChild(sum);
    const t = document.createElement('table');
    t.innerHTML = `<thead><tr><th scope="col">${tr('Does', 'Gör')}</th><th scope="col">${tr('Key', 'Tangent')}</th><th scope="col"><span class="dim"></span></th></tr></thead><tbody></tbody>`;
    for (const k of g.keys) {
      const name = LNG === 'sv' ? k.sv : k.en, o = ST.own(g.tool, k.id);
      const row = t.tBodies[0].insertRow();
      row.innerHTML = '<th scope="row"></th><td class="cur"></td><td class="act"><button type="button" data-c></button><button type="button" data-r></button></td>';
      row.cells[0].textContent = name;
      const cur = row.cells[1];
      if (k.fixed) {
        cur.textContent = ST.keyLabel(k.key) + ' ';
        const sm = document.createElement('small'); sm.textContent = tr('(always)', '(alltid)'); cur.appendChild(sm);
        if (o) cur.append(' + ' + ST.label(o));
      } else if (o && o.pad) cur.textContent = ST.keyLabel(k.key) + ' + ' + ST.label(o);
      else cur.textContent = ST.keyLabel(o ? o.key : k.key) + (o ? '' : ' ');
      if (!k.fixed && !o) { const sm = document.createElement('small'); sm.textContent = tr('(standard)', '(standard)'); cur.appendChild(sm); }
      const c = row.querySelector('[data-c]'), r = row.querySelector('[data-r]');
      c.textContent = k.fixed ? tr('Add', 'Lägg till') : tr('Change', 'Ändra');
      c.setAttribute('aria-label', c.textContent + ': ' + name);
      r.textContent = tr('Reset', 'Återställ');
      r.setAttribute('aria-label', tr('Reset: ', 'Återställ: ') + name);
      r.disabled = !o;
      r.onclick = () => { ST.setOwn(g.tool, k.id, null); renderKeys(); note('nKeys', tr(`${name}: back to ${ST.keyLabel(k.key)}.`, `${name}: tillbaka till ${ST.keyLabel(k.key)}.`), 'good'); };
      c.onclick = () => learnKey(g, k, c);
    }
    d.appendChild(t);
    host.appendChild(d);
  }
}
function learnKey(g, k, btn) {
  stopBusy();
  const name = LNG === 'sv' ? k.sv : k.en, part = LNG === 'sv' ? g.sv : g.en;
  busy = btn; btn.classList.add('learning'); btn.textContent = tr('Press now…', 'Tryck nu…');
  note('nKeys', tr(`${name}: press the key, the key combination or the joystick button. Esc cancels.`, `${name}: tryck tangenten, tangentkombinationen eller joystickknappen. Esc avbryter.`));
  SW.capture((x) => {
    busy = null;
    const done = (t, cls) => { renderKeys(); note('nKeys', t, cls); const again = $('tools').querySelector(`details[data-tool="${g.tool}"]`); if (again) again.open = true; };
    if (!x) return done(tr('Cancelled — nothing was changed.', 'Avbrutet — inget ändrades.'));
    const b = x.pad ? x : { key: x.key };
    if (!x.pad && !ST.okKey(b.key)) return done(tr(`${b.key} cannot be used as a shortcut.`, `${b.key} går inte att använda som kortkommando.`), 'bad');
    if (!x.pad && ST.reserved(b.key)) return done(tr(`${ST.keyLabel(b.key)} is kept for moving, choosing, writing or the window — choose another.`,
      `${ST.keyLabel(b.key)} behövs för att flytta, välja, skriva eller för fönstret — välj en annan.`), 'bad');
    if (!x.pad && !k.fixed && b.key === k.key) { ST.setOwn(g.tool, k.id, null); return done(tr(`${name}: ${ST.keyLabel(k.key)}, the standard key.`, `${name}: ${ST.keyLabel(k.key)}, standardtangenten.`), 'good'); }
    const roles = SW.config;
    const all = ST.conflicts(g.tool, k.id, b, roles);
    const sw = all.find(c => c.role);
    if (sw) return done(tr(`${ST.label(b)} is the switch ${ROLE_LABEL[sw.role]} — remove it there first, or choose another.`,
      `${ST.label(b)} är brytaren ${ROLE_LABEL[sw.role]} — ta bort den där först, eller välj en annan.`), 'bad');
    const busyWith = all.filter(c => !c.role);
    if (busyWith.length) {
      const c = busyWith[0];
      return done(tr(`${ST.label(b)} is already used for “${c.name}” (${c.part}) — change that one first, or choose another.`,
        `${ST.label(b)} används redan för ”${c.name}” (${c.part}) — ändra den först, eller välj en annan.`), 'bad');
    }
    ST.setOwn(g.tool, k.id, b);
    done(tr(`${name} (${part}): ${ST.label(b)}`, `${name} (${part}): ${ST.label(b)}`) + (k.fixed ? tr(`, besides ${ST.keyLabel(k.key)}.`, `, utöver ${ST.keyLabel(k.key)}.`) : '.') +
      (x.pad && x.i === 0 && x.pad === 'button' ? ' ' + tr('Joystick button 1 no longer chooses — learn Choose on another button.', 'Joystickknapp 1 väljer inte längre — lär in Välj på en annan knapp.') : ''), 'good');
  }, { chord: true });
}

/* ---- the whole page from the settings (here, or changed in another tab) ---- */
function render() {
  const s = S();
  for (const r of document.querySelectorAll('input[name=mode]')) r.checked = r.value === s.mode;
  $('optStick').checked = SW.config.stick;
  $('optScanMs').value = s.scan.ms; $('oScanMs').textContent = secs(s.scan.ms);
  $('optRounds').value = String(s.scan.rounds);
  $('optRestart').value = s.scan.restart ? 'yes' : 'no';
  $('optDwell').value = s.dwell.ms; $('oDwell').textContent = secs(s.dwell.ms);
  $('optRing').checked = s.dwell.ring; $('optPause').checked = s.dwell.pause;
  $('optStrong').checked = s.strong;
  if (!busy) { renderRoles(); renderKeys(); }
}
ST.onChange(render);
addEventListener('storage', (e) => { if (e.key === 'wb-brytare' && !busy) setTimeout(() => { renderRoles(); $('optStick').checked = SW.config.stick; }, 0); });
render();

$('btnReset').onclick = () => {
  if (!confirm(tr('Reset the way of steering, the switches and every shortcut to the standard?', 'Återställa styrsättet, brytarna och alla kortkommandon till standard?'))) return;
  stopBusy();
  ST.save({});
  SW.forget(); SW.setStick(true);
  render();
  note('nMode', tr('Everything is back to the standard.', 'Allt är tillbaka till standard.'), 'good');
};
// opened from a part: close the tab and go back to it; else to the start page
$('btnDone').onclick = () => {
  if (window.opener && !window.opener.closed) { window.close(); setTimeout(() => { location.href = 'start.html'; }, 400); }
  else location.href = 'start.html';
};
</script>
