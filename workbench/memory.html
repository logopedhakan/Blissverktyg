<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#28558C">
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Bliss — memory</title>
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="css/wb-base.css">
<style>
body{font-family:"Atkinson Hyperlegible Next","Atkinson Hyperlegible",system-ui,sans-serif;
  background:var(--bg);color:var(--ink);height:100vh;display:flex;flex-direction:column}
header{display:flex;align-items:baseline;gap:14px;padding:12px 18px;flex-wrap:wrap}
header h1{font-size:20px}
header .sub{color:var(--dim);font-size:13px}
/* the players (2026-11-26, "more like a game"): one card each, in the player's colour.
   Whose turn it is stands out (big frame, "Your turn", the board framed in the same
   colour); whoever leads wears the crown; the pairs a player has found sit on their card. */
#players{display:flex;gap:10px;flex-wrap:wrap}
.pc{--pc:var(--accent);flex:1 1 170px;min-width:0;display:flex;flex-direction:column;gap:6px;padding:8px 12px;border-radius:14px;
  background:color-mix(in srgb,var(--pc) 10%,var(--panel));border:3px solid color-mix(in srgb,var(--pc) 35%,transparent);
  transition:transform .2s,opacity .2s,box-shadow .2s}
.pc.on{border-color:var(--pc);box-shadow:0 0 0 4px color-mix(in srgb,var(--pc) 30%,transparent),0 4px 14px rgba(0,0,0,.15);transform:translateY(-2px)}
.pc.wait{opacity:.62}
.pcHead{display:flex;align-items:center;gap:7px;flex-wrap:wrap;font-weight:700;font-size:16px}
.pcHead .pname{color:var(--pc)}
.pc .sym svg{height:26px;width:auto;display:block}
.pc .sym .bfill{fill:currentColor}
.pcHead > .sym{color:var(--pc)}
.badge{display:inline-flex;align-items:center;gap:5px;padding:2px 10px 2px 6px;border-radius:999px;font-size:13.5px;font-weight:700;white-space:nowrap}
.badge .sym svg{height:20px}
.badge.turn{background:var(--pc);color:#fff;animation:turnPulse 1.4s ease-in-out infinite}
.badge.lead{background:#f2c230;color:#3b2a00}
@keyframes turnPulse{50%{box-shadow:0 0 0 5px color-mix(in srgb,var(--pc) 30%,transparent)}}
.pcBody{display:flex;align-items:center;gap:10px;min-height:34px}
.pts{font-size:30px;font-weight:800;line-height:1;color:var(--pc);min-width:1.2em;text-align:center}
.pts.bump{animation:bump .6s ease-out}
@keyframes bump{30%{transform:scale(1.6)}100%{transform:scale(1)}}
.tokens{display:flex;flex-wrap:wrap;gap:4px;min-width:0}
.tokens .tok{display:inline-flex;align-items:center;justify-content:center;height:30px;min-width:30px;padding:2px 4px;border-radius:7px;
  background:var(--stage);border:2px solid var(--pc);color:var(--ink)}
.tokens .tok svg{height:22px;width:auto;display:block}
.stat{display:inline-flex;align-items:center;gap:6px;font-size:15px;color:var(--dim)}
.stat b{font-size:22px;color:var(--ink)}
.stat .sym svg{height:22px}
@media (prefers-reduced-motion: reduce){.pc,.pts.bump,.badge.turn{transition:none;animation:none}}
main{flex:1;display:grid;grid-template-columns:1fr 280px;gap:14px;padding:0 18px 14px;min-height:0}
/* the board in a frame of the colour of the player whose turn it is */
#boardWrap{--turn:var(--rule);flex:1;min-height:0;position:relative;display:flex;flex-direction:column;gap:8px;padding:8px;border-radius:18px;
  border:4px solid var(--turn);background:color-mix(in srgb,var(--turn) 7%,transparent);transition:border-color .3s,background-color .3s}
@media (prefers-reduced-motion: reduce){#boardWrap{transition:none}}
/* "Player 2's turn": a strip at the top of the board in the player's colour, never over
   the cards; it jumps when the turn changes */
#turnBanner{--pc:#2463c9;align-self:center;display:flex;align-items:center;gap:8px;padding:4px 18px 4px 12px;border-radius:999px;
  background:var(--pc);color:#fff;font-size:clamp(16px,2.4vmin,22px);font-weight:800;box-shadow:0 3px 10px rgba(0,0,0,.18)}
#turnBanner[hidden]{display:none}
#turnBanner .sym svg{height:1.3em;width:auto;display:block}
#turnBanner .bfill{fill:#fff}
#turnBanner.show{animation:banner .7s cubic-bezier(.2,1.5,.5,1)}
@keyframes banner{0%{transform:scale(.6);opacity:.3}100%{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion: reduce){#turnBanner.show{animation:none}}
/* the end: who won, with the scores, and Play again */
#win{position:absolute;inset:0;z-index:6;display:flex;align-items:center;justify-content:center;overflow:hidden;border-radius:14px;
  background:color-mix(in srgb,var(--bg) 55%,transparent);backdrop-filter:blur(2px)}
#win[hidden]{display:none}
.winBox{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;max-width:min(92%,460px);
  padding:20px 26px;border-radius:20px;background:var(--panel);border:4px solid var(--win,var(--ok));box-shadow:0 10px 40px rgba(0,0,0,.3);
  animation:winIn .45s cubic-bezier(.2,1.4,.5,1)}
@keyframes winIn{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
.winBox .big svg{height:72px;width:auto;display:block}
.winBox .big{color:var(--win,var(--ok))}
.winBox .big .bfill{fill:currentColor}
.winBox h2{font-size:clamp(20px,3.4vmin,30px);line-height:1.2}
#winList{list-style:none;display:flex;flex-direction:column;gap:5px;min-width:220px}
#winList li{display:flex;align-items:center;gap:8px;padding:4px 12px;border-radius:10px;font-size:16px;font-weight:700;
  background:color-mix(in srgb,var(--pc) 12%,transparent);border:2px solid var(--pc);color:var(--ink)}
#winList li .n{margin-left:auto;font-size:20px;color:var(--pc)}
#winList li .sym svg{height:22px;width:auto;display:block}
.winBtns{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.winBtns button{min-height:48px;display:inline-flex;align-items:center;gap:7px}
.winBtns .sym svg{height:24px;width:auto;display:block}
.winBtns .primary .bfill{fill:currentColor}
.confetti{position:absolute;inset:0;pointer-events:none}
.confetti i{position:absolute;top:-14px;width:10px;height:14px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
@media (prefers-reduced-motion: reduce){.winBox{animation:none}.confetti{display:none}}
#play{display:flex;flex-direction:column;gap:8px;min-width:0;min-height:0}
#msg{font-size:16px;min-height:24px;color:var(--dim)}
#msg.good{color:var(--ok);font-weight:600} #msg.bad{color:var(--sel)}
/* the cards fill the free space; the page picks columns so they stay near square */
#board{flex:1;min-width:0;min-height:0;display:grid;gap:clamp(6px,1.2vmin,14px);
  grid-template-columns:repeat(var(--cols,4),minmax(0,1fr));grid-template-rows:repeat(var(--rows,3),minmax(0,1fr))}
.card{position:relative;container-type:size;padding:0;border-radius:14px;border:2px solid var(--rule);
  background:var(--stage);color:var(--ink);cursor:pointer;overflow:hidden;font:inherit;min-height:0}
.card:focus-visible{outline:4px solid var(--sel);outline-offset:3px}
.card .back,.card .face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4%}
.card .back{background:var(--accent);
  background-image:radial-gradient(circle at 50% 50%, transparent 0 22%, color-mix(in srgb,var(--on-accent) 22%,transparent) 22.5% 25%, transparent 25.5%),
                   radial-gradient(circle at 50% 50%, color-mix(in srgb,var(--on-accent) 22%,transparent) 0 6%, transparent 6.5%)}
.card .num{position:absolute;left:8px;top:5px;font-size:clamp(11px,12cqmin,18px);color:var(--on-accent);opacity:.8}
.card .face{display:none;padding:6%}
.card.up .face,.card.found .face{display:flex}
.card.up .back,.card.found .back{display:none}
.card.up{border-color:var(--accent)}
.card.up,.card.found{animation:flipIn .2s ease-out}
@keyframes flipIn{0%{transform:scaleX(.05)}100%{transform:scaleX(1)}}
@media (prefers-reduced-motion: reduce){.card.up,.card.found{animation:none}}
.card.miss{border-color:var(--sel);box-shadow:0 0 0 3px color-mix(in srgb,var(--sel) 35%,transparent)}
.card.found{border-color:var(--by,var(--ok));cursor:default;opacity:.75}
.card.found::after{content:"✓";position:absolute;right:6px;top:5px;color:var(--by,var(--ok));font-weight:800;font-size:clamp(12px,13cqmin,22px)}
/* found by a player: their number on a dot of their colour */
.card.found[data-by]::after{content:attr(data-by);color:#fff;background:var(--by);border-radius:999px;min-width:1.5em;height:1.5em;
  display:flex;align-items:center;justify-content:center;font-size:clamp(11px,11cqmin,18px)}
.card.pop{animation:pop .5s ease-out}
@keyframes pop{35%{transform:scale(1.1)}100%{transform:scale(1)}}
@media (prefers-reduced-motion: reduce){.card.pop{animation:none}}
#board.won .card.found{opacity:1;box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 35%,transparent)}
.face svg{width:84%;height:64%;flex:none}
.face.noLabel svg{height:80%}
.face .lbl{font-size:clamp(11px,11cqmin,30px);line-height:1.1;text-align:center;overflow-wrap:anywhere}
.face .word{font-size:clamp(14px,19cqmin,56px);font-weight:700;line-height:1.1;text-align:center;overflow-wrap:anywhere}
#side{display:flex;flex-direction:column;gap:9px;background:var(--panel-2);border-radius:14px;padding:12px;overflow-y:auto;min-height:0}
#side label{display:flex;flex-direction:column;gap:3px;font-size:13.5px}
#side label.chk{flex-direction:row;align-items:center;gap:7px}
select,textarea{font:inherit;padding:6px;border-radius:8px;border:1px solid var(--rule);background:var(--panel);color:var(--ink)}
textarea{min-height:64px;resize:vertical}
button{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--rule);border-radius:10px;padding:6px 10px;cursor:pointer}
button:hover{border-color:var(--accent)}
.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent,#fff);font-weight:600;font-size:16px;padding:9px 12px}
#ownRow{display:flex;flex-direction:column;gap:6px}
#ownRow[hidden]{display:none}
.hint{font-size:11.5px;color:var(--dim)}
/* pairs, players and the turning back as big buttons with pictures (2026-11-26) */
#side .optHead{font-size:13.5px;margin-top:2px}
.choices{display:grid;gap:6px}
.choices.pairs{grid-template-columns:repeat(5,minmax(0,1fr))}
.choices.players{grid-template-columns:repeat(4,minmax(0,1fr))}
.choices.back{grid-template-columns:repeat(3,minmax(0,1fr))}
.choice{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-width:0;min-height:64px;padding:6px 2px;
  border-width:2px;border-radius:12px;font-size:13px;font-weight:700;line-height:1.1;transition:transform .12s,box-shadow .12s}
.choice:hover{transform:translateY(-1px)}
.choice[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent,#fff);
  box-shadow:0 3px 10px color-mix(in srgb,var(--accent) 40%,transparent)}
.choice:focus-visible{outline:3px solid var(--sel);outline-offset:2px}
/* a little board: as many cards as the game will have */
.mini{display:grid;gap:1.5px;grid-template-columns:repeat(var(--c),4px)}
.mini i{width:4px;height:6px;border-radius:1px;background:var(--accent);opacity:.85}
.choice .n{font-size:17px;line-height:1}
.choice .u{font-size:11px;font-weight:600;line-height:1}
.choice[aria-pressed="true"] .mini i{background:var(--on-accent,#fff)}
/* the players, one person each, in the colour they get on the board */
.ppl{display:flex;justify-content:center;flex-wrap:nowrap;gap:0;max-width:100%;padding:2px 3px;border-radius:7px}
.ppl .sym svg{height:20px;width:auto;display:block}
.ppl .sym{color:var(--pc)}
.choice[aria-pressed="true"] .ppl{background:#fff}
.choice .big svg{height:26px;width:auto;display:block}
.choice .big .bfill{fill:currentColor}
@media (prefers-reduced-motion: reduce){.choice{transition:none}.choice:hover{transform:none}}
footer{padding:3px 12px 5px;font-size:11px;line-height:1.3;color:var(--dim)}
/* narrow: the board on top at a fixed height, the settings below it, the page scrolls */
@media (max-width:760px){
  main{grid-template-columns:1fr;grid-template-rows:auto auto;align-content:start;overflow-y:auto}
  #play{min-height:auto}
  #boardWrap{flex:none;height:min(70vh,120vw)}
  #side{overflow:visible}
}
</style>

      </div>

        <option value="alla" data-en="Hard · the whole Bliss list">Svår · hela blisslistan</option>
        <option value="egna" data-en="My own words">Egna ord</option>

    </label>
    <div id="ownRow" hidden>
      <textarea id="ownWords" aria-label="Egna ord" data-en-aria="My own words"

      <button id="btnOwn"><span data-en="Play with these words">Spela med orden</span></button>

    <label><span id="optPlayersHead" data-en="Players">Spelare</span>
      <select id="optPlayers">
        <option value="1" data-en="One player">En spelare</option>
        <option value="2" data-en="Two players, taking turns">Två spelare, turas om</option>
        <option value="3" data-en="Three players">Tre spelare</option>
        <option value="4" data-en="Four players">Fyra spelare</option>
      </select>
    </label>
    <label><span id="optBackHead" data-en="Cards that are not a pair turn back">Kort som inte är ett par vänds tillbaka</span>
      <select id="optBack">

  </aside>
</main>

<script>
'use strict';
const $ = (id) => document.getElementById(id);

/* Language: follows the suite's wb-lang. Swedish is the text in the markup;
   English comes from the data-en attributes. */
const LNG = wbLang();
const tr = (en, sv) => LNG === 'sv' ? sv : en;
document.documentElement.lang = LNG;
if (LNG === 'en') {
  document.title = 'Bliss — memory';
  for (const el of document.querySelectorAll('[data-en]')) el.textContent = el.dataset.en;
  for (const el of document.querySelectorAll('[data-en-title]')) el.title = el.dataset.enTitle;
  for (const el of document.querySelectorAll('[data-en-ph]')) el.placeholder = el.dataset.enPh;
  for (const el of document.querySelectorAll('[data-en-aria]')) el.setAttribute('aria-label', el.dataset.enAria);
}

/* ---- game core (no page here: tests/run.js runs this part on its own) ---- */
function shuffle(a, rnd = Math.random) {
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
// n entries ({sym, word}) with different symbols and different words
function pickEntries(pool, n, rnd = Math.random) {
  const out = [], ids = new Set(), words = new Set();
  for (const e of shuffle(pool.slice(), rnd)) {
    const w = e.word.toLowerCase();
    if (ids.has(e.sym.id) || words.has(w)) continue;
    ids.add(e.sym.id); words.add(w); out.push(e);
    if (out.length === n) break;
  }
  return out;
}
// two cards per entry: the symbol twice, or the symbol and its word
function makeDeck(entries, kind, rnd = Math.random) {
  return shuffle(entries.flatMap((e, p) => [
    { p, sym: e.sym, word: e.word, show: 'sym', found: false },
    { p, sym: e.sym, word: e.word, show: kind === 'word' ? 'word' : 'sym', found: false }]), rnd);
}
function newState(deck, players) {
  const n = Math.max(1, Math.min(4, Math.floor(+players) || 1));
  return { deck, up: [], moves: 0, turn: 0, scores: new Array(n).fill(0), over: false };
}
/* One press on card i. Two cards that were not a pair stay up until the timer
   or the next press turns them back: pressing one of them only turns them back,
   pressing another card turns them back and that card up — one press, not two. */
function turnCard(G, i) {
  const c = G.deck[i];
  if (!c || G.over || c.found) return { what: 'none' };
  let covered = false;
  if (G.up.length === 2) {
    const was = G.up.includes(i);
    G.up = []; covered = true;
    if (was) return { what: 'cover' };
  }
  if (G.up.includes(i)) return { what: 'none' };
  G.up.push(i);
  if (G.up.length === 1) return { what: 'up', i, covered };
  G.moves++;
  const [a, b] = G.up;
  if (G.deck[a].p === G.deck[b].p) {
    G.deck[a].found = G.deck[b].found = true;
    G.deck[a].by = G.deck[b].by = G.turn;            // who found it, and when
    G.deck[a].at = G.deck[b].at = G.moves;
    G.up = [];
    G.scores[G.turn]++;
    if (G.deck.every(d => d.found)) { G.over = true; return { what: 'end', i, a, b }; }
    return { what: 'pair', i, a, b };
  }
  G.turn = (G.turn + 1) % G.scores.length;          // a miss: the next player's turn
  return { what: 'miss', i, a, b };
}
// the players with the most pairs (none while nobody has a pair)
function leaders(G) {
  const m = Math.max(...G.scores);
  return m > 0 ? G.scores.map((v, k) => (v === m ? k : -1)).filter(k => k >= 0) : [];
}
function coverCards(G) { if (G.up.length !== 2) return false; G.up = []; return true; }
// columns that keep the cards closest to square in a w × h box, rows filled
function gridFor(count, w, h) {
  let best = null;
  for (let cols = 2; cols <= count; cols++) {
    const rows = Math.ceil(count / cols), empty = cols * rows - count;
    const score = Math.abs(Math.log((w / cols) / (h / rows) / 0.85)) + empty * 0.1;
    if (!best || score < best.score) best = { cols, rows, score };

}

/* ---- words and symbols ---- */
const SV = (typeof BLISS_GLOSSES !== 'undefined' && BLISS_GLOSSES.sv) || {};
const clean = (w) => w.replace(/\s*\([^)]*\)/g, '').replace(/_/g, ' ').trim();
// in Swedish a BCI symbol needs its Swedish gloss; a symbol from an opened list has its own name
function wordsOf(sym) {
  return String((LNG === 'sv' ? (SV[sym.id] || (sym.own ? sym.n : '')) : sym.n) || '').split(',').map(clean).filter(Boolean);
}
const wordOf = (sym) => wordsOf(sym)[0] || '';
const drawable = (s) => !!s && Array.isArray(s.e) && s.e.length > 0 && !/^indicator_/.test(s.n || '') && !!wordOf(s);
const svWords = (id) => (SV[id] || '').split(',').map(w => clean(w).toLowerCase());

let ownEntries = [];               // the teacher's own words, found in BCI-AV
function pool(level) {
  if (level === 'egna') return ownEntries;
  const src = level === 'lista' && customList ? customList : BLISS_DATA;
  return src.filter(s => {
    if (!drawable(s)) return false;
    if (level === 'latt') return s.c === 'YELLOW' && svWords(s.id).some(w => WB_VARDAGSORD.has(w));
    if (level === 'gula') return s.c === 'YELLOW';
    return true;
  }).map(sym => ({ sym, word: wordOf(sym) }));

// a written word -> its symbol: the word as the first gloss first, then a yellow word, then the simpler symbol
function findSymbol(word) {
  const q = word.toLowerCase();
  let best = null, score = -Infinity;
  for (const s of BLISS_DATA) {
    if (!drawable(s)) continue;
    const k = wordsOf(s).map(w => w.toLowerCase()).indexOf(q);
    if (k < 0) continue;
    const sc = (k === 0 ? 4 : 0) + (s.c === 'YELLOW' ? 2 : 0) - s.e.length / 100;
    if (sc > score) { score = sc; best = s; }
